<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="hkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241805"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#hkGlow)"/>
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#e30037" stroke-width="3"/>
  <path d="M 590 30 L 590 10 L 570 10" fill="none" stroke="#e30037" stroke-width="3"/>
  <path d="M 10 370 L 10 390 L 30 390" fill="none" stroke="#e30037" stroke-width="3"/>
  <path d="M 590 370 L 590 390 L 570 390" fill="none" stroke="#e30037" stroke-width="3"/>

  <!-- Trophy Emblem & Waveform -->
  <g transform="translate(300, 180)">
