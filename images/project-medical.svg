<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="medGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#051d1e"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#medGlow)"/>
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#03dac6" stroke-width="3"/>
  <path d="M 590 30 L 590 10 L 570 10" fill="none" stroke="#03dac6" stroke-width="3"/>
  <path d="M 10 370 L 10 390 L 30 390" fill="none" stroke="#03dac6" stroke-width="3"/>
  <path d="M 590 370 L 590 390 L 570 390" fill="none" stroke="#03dac6" stroke-width="3"/>

  <!-- Medical Cross & Pulse Wave -->
  <g transform="translate(300, 185)">
    <!-- ECG Pulse Line -->
    <path d="M -220 20 L -120 20 L -90 -30 L -70 50 L -40 -10 L -20 20 L 220 20" fill="none" stroke="#03dac6" stroke-width="2"/>
    
    <!-- Cross Shield -->
    <circle r="60" fill="#041215" stroke="#03dac6" stroke-width="2"/>
    <rect x="-10" y="-35" width="20" height="70" fill="#03dac6" rx="3"/>
    <rect x="-35" y="-10" width="70" height="20" fill="#03dac6" rx="3"/>

    <text x="0" y="85" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="20" fill="#ffffff">HEALTHCARE APPOINTMENT SYSTEM</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="12" fill="#03dac6">PHP // JS // RELATIONAL DB // DOCTOR-PATIENT WORKFLOW</text>
  </g>

  <text x="35" y="50" font-family="'Share Tech Mono', monospace" font-size="13" fill="#03dac6" letter-spacing="2">SYSTEM: 03 // CLINICAL PLATFORM</text>
  <text x="565" y="50" text-anchor="end" font-family="'Share Tech Mono', monospace" font-size="12" fill="rgba(255,255,255,0.5)">FULL-STACK BACKEND</text>
